<div style="float: {{include.align}};" class="base-image"> 
    <figure>
        <img src="{{include.file}}" style="max-width: {{include.max-width}}" alt="{{include.alt}}">
        <figcaption class="base-image-caption" style="max-width: {{include.max-width}}">{{include.image-caption | markdownify }}</figcaption>
    </figure>
</div>
